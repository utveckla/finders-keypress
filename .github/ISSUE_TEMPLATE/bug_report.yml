name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard / device
      description: Make and model, and whether it has a scroll wheel or dial.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open DevTools (F12) and paste any errors from the Console.
      render: shell
